services:
  autogpt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autogpt-sandbox
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=100M
      - /home/autogpt:size=200M
    volumes:
      - /root/AutoGPT/source/auto_gpt_workspace:/app/auto_gpt_workspace:rw
      - /root/AutoGPT/source/ai_settings.yaml:/app/ai_settings.yaml:ro
      # Sanitized /etc/passwd and /etc/group (ATK-18: block symlink leak of host passwd)
      - /root/AutoGPT/sandbox-etc/passwd:/etc/passwd:ro
      - /root/AutoGPT/sandbox-etc/group:/etc/group:ro
    env_file:
      - /root/.env
    environment:
      - AUTOGPT_MODE=1
      - SKIP_CONFIRMATIONS=True
      - CONTINUOUS_MODE=true
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sleep", "infinity"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
